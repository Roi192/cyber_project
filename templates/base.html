<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Website Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Website Monitor</span>
    </div>
    <div class="topbar-right">
      <span class="ti-pill ti-{{ threat_intel.status|lower }}" id="ti-pill" title="{{ threat_intel.detail }}">
        Threat intel: <span class="ti-pill-label">{{ ti_labels[threat_intel.status] }}</span>
      </span>
      <span class="dev-pill" id="dev-pill" {% if not dev_mode %}hidden{% endif %}
            title="API_KEY is empty: endpoint uploads are not authenticated. Development only.">DEV MODE</span>
      <nav class="nav">
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' else '' }}">Dashboard</a>
        <a href="{{ url_for('browsing') }}" class="{{ 'active' if request.endpoint == 'browsing' else '' }}">Browsing</a>
        <a href="{{ url_for('alerts') }}" class="{{ 'active' if request.endpoint == 'alerts' else '' }}">Alerts</a>
        <a href="{{ url_for('endpoints') }}" class="{{ 'active' if request.endpoint == 'endpoints' else '' }}">Computers</a>
      </nav>
    </div>
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Only website names and paths are recorded. Passwords, cookies, form contents and page contents are never collected.
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
